{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Student registration</title>
    <link rel="stylesheet" href="{% static 'registration/style.css' %}">
</head>
<body>
    <h1>Student registration</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p><a href="{% url 'student_list' %}">View Student Directory</a></p>
</body>
</html>
